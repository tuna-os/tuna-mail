# Gradle user-home properties for builds inside the build-env container.
# run.sh copies this file to the mounted GRADLE_USER_HOME, where it overrides
# the project's gradle.properties (which asks for a 10 GB heap). The build host
# is shared and short on memory, so the daemon and workers are capped:
# - one JVM does all the work: Kotlin compiles in the Gradle daemon rather than
#   in a separate Kotlin daemon (the project already does so; this extends it
#   to the included build-plugin and components builds);
# - the JVM sizes its GC and compiler threads for 3 CPUs, not the host's 32.
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=256m -Xmx2g -XX:MaxMetaspaceSize=768m -XX:ActiveProcessorCount=3 -XX:+IgnoreUnrecognizedVMOptions -XX:+SuppressCDSWarning
org.gradle.workers.max=3
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -Xmx1g
