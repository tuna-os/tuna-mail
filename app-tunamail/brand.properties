# Tuna Mail app identity. This is the only place the app's name and application id are set:
# renaming the app is a change to these two lines. build.gradle.kts reads them into the
# applicationId, the `app_name` string resource and BuildConfig.CLIENT_INFO_APP_NAME.
#
# The Kotlin package (`org.tunaos.mail`, the Android namespace) is independent of the
# application id and does not need to change with it.
applicationId=org.tunaos.mail
appName=Tuna Mail
